[project]
name = "mocca"
version = "0.1.0"
description = "A tool to compute obstruction of a telescope by a hemispherical dome"
readme = "README.md"
authors = [
    { name = "Mick Veldhuis" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytransform3d>=3.16.0",
]

[project.scripts]
mocca = "mocca.main:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "ipython>=9.18.0",
  "marimo>=0.25.1",
  "pre-commit",
  "py-spy",
  "pytest>=9.1.1",
  "ty>=0.0.91",
]
